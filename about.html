<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>关于我 · 云栖野步</title>
  <link rel="stylesheet" href="style.css?v=20261122a" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="config.js?v=20261122a"></script>
  <script src="cloud.js?v=20261122a"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-avatar"><img src="brand.png" alt="云栖野步" /></div>
        <h1 class="site-title">云栖野步</h1>
        <div class="site-sub">做 知 识 传 递 的 催 化 剂</div>
      </div>
      <div class="site-rule"></div>
      <nav class="site-nav">
        <a href="index.html">首页</a>
        <a href="index.html?cat=运动">运动</a>
        <a href="index.html?cat=随笔">随笔</a>
        <a href="about.html" class="active">关于我</a>
      </nav>
      <div class="site-rule"></div>
      <nav class="site-nav site-nav-sub"><a href="admin.html">后台写作 →</a></nav>
    </aside>

    <main class="main">
      <div class="container">
        <article class="post about">
          <a class="post-back" href="index.html">← 返回首页</a>
          <h1 class="post-title" id="about-title">关于我</h1>
          <div class="about-note" id="about-note" style="display:none"></div>
          <div class="post-body" id="about-body">
            <p>这里写一段关于你的介绍……</p>
            <p>内容可在后台「⚙ 站点设置 → 关于我」中编辑并保存。</p>
          </div>

          <div class="about-stats" id="about-stats"></div>
          <div class="about-sep" aria-hidden="true">· · · ·</div>

          <section class="about-rules" id="about-rules" style="display:none">
            <ol id="about-rules-list"></ol>
          </section>
        </article>
      </div>

      <footer class="site-footer" data-site-footer>© 云栖野步 · 由 Gitee 免费托管</footer>
    </main>
  </div>

  <script>
    // 关于我：内容来自站点设置（后台可编辑），Markdown 渲染，支持图片
    async function renderAbout() {
      const site = await Cloud.initChrome();
      const about = site.about || {};
      const titleEl = document.getElementById("about-title");
      const noteEl = document.getElementById("about-note");
      const bodyEl = document.getElementById("about-body");
      if (about.title) {
        titleEl.textContent = about.title;
        document.title = about.title + " · " + site.title;
      }
      if (about.note && String(about.note).trim()) {
        noteEl.textContent = about.note;
        noteEl.style.display = "block";
      }
      const md = String(about.content || "");
      const raw = window.normalizeParagraphs ? window.normalizeParagraphs(md) : md;
      const html = (typeof marked !== "undefined" && marked.parse)
        ? marked.parse(raw)
        : "<p>" + raw.replace(/</g, "&lt;").replace(/\n/g, "<br>") + "</p>";
      bodyEl.innerHTML = window.protectImageHtml(html);
      if (window.markImageParagraphs) window.markImageParagraphs(bodyEl);
      // 站点说明列表：来自站点设置（后台「站点设置 → 关于我」可编辑），空则整栏隐藏
      const rulesSec = document.getElementById("about-rules");
      const rulesList = document.getElementById("about-rules-list");
      const rules = Array.isArray(about.rules) ? about.rules.filter(Boolean) : [];
      if (rules.length) {
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
        rulesList.innerHTML = rules.map((r) => `<li>${esc(r)}</li>`).join("");
        rulesSec.style.display = "block";
      } else {
        rulesSec.style.display = "none";
        document.querySelector(".about-sep").style.display = "none";
      }
      await renderStats();
    }

    // 数据统计卡片：从文章数据与本机访问记录自动计算
    function fmtNum(n) {
      return n >= 10000 ? (Math.round(n / 1000) / 10) + "万" : String(n);
    }
    async function renderStats() {
      const box = document.getElementById("about-stats");
      let posts = [];
      try { posts = await Cloud.getPosts(); } catch (e) {}
      posts = posts.filter((p) => p.status === "published");
      const words = posts.reduce((s, p) => s + String(p.content || "").length, 0);
      const imgRe = /!\[[^\]]*\]\(([^)]+)\)/g;
      let imgs = 0;
      posts.forEach((p) => {
        const m = String(p.content || "").match(imgRe);
        imgs += (m ? m.length : 0) + (p.cover_image ? 1 : 0);
      });
      const tags = [...new Set(posts.flatMap((p) => p.tags || []).filter(Boolean))];
      let days = 0;
      if (posts.length) {
        const t0 = Math.min(...posts.map((p) => new Date(p.created_at).getTime()).filter((t) => !isNaN(t)));
        if (t0) days = Math.max(1, Math.floor((Date.now() - t0) / 86400000) + 1);
      }
      let views = 0;
      if (window.getViewCount) posts.forEach((p) => { views += window.getViewCount(p.id); });

      const cards = [
        [fmtNum(posts.length), "文章总数"],
        [fmtNum(words), "累计字数"],
        [fmtNum(imgs), "图片总数"],
        [fmtNum(tags.length), "标签总数"],
        [fmtNum(days), "运营天数"],
        [fmtNum(views), "本机访问"],
      ];
      box.innerHTML = cards.map((c) =>
        `<div class="st-card"><div class="st-num">${c[0]}</div><div class="st-lab">${c[1]}</div></div>`
      ).join("");
    }
    renderAbout();
  </script>
</body>
</html>
